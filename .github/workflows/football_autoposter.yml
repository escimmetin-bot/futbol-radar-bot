name: FutbolRadar 7/24 Cloud Auto Poster

on:
  schedule:
    # 30 dakikada bir kontrol eder, 4 saatlik zaman kilidi dolduğunda otomatik paylaşır
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manuel tek tıkla çalıştırma butonu

permissions:
  contents: write

jobs:
  post-football:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Futbol Döngüsünü Çalıştır
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHAT: ${{ secrets.TELEGRAM_TARGET_CHAT || '@Futbolradars' }}
          BRAND_NAME: "FUTBOL & TRANSFER RADARI"
          X_HANDLE: "@FutbolTransfr"
          POST_COOLDOWN_MINUTES: "210.0"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Paylaşım Geçmişini Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_posted_history.json || true
          git commit -m "chore(history): update football post history [skip ci]" || true
          git push || true
